
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opciones de Decoración</title>

<style>
body{
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background:#f6f3ed;
padding:40px;
}

.decoracion-opciones{
max-width:900px;
margin:auto;
display:flex;
flex-direction:column;
gap:20px;
}

.opcion input{
display:none;
}

.opcion-card{
border:2px solid #e5e5e5;
border-radius:16px;
padding:20px;
cursor:pointer;
transition:all .25s ease;
background:white;
}

.opcion input:checked + .opcion-card{
border:2px solid #8FA88F;
background:#F5F8F5;
}

.opcion-img{
width:100%;
border-radius:14px;
margin-top:12px;
}

.precio{
color:#b48a3c;
font-weight:600;
margin-top:5px;
}
</style>

</head>
<body>

<div class="decoracion-opciones">

<!-- BASICA -->
<label class="opcion">
<input type="radio" name="decoracion" value="basica" checked>
<div class="opcion-card">
<h3>Básica — Incluida</h3>
<p>Camino de mesa de gasa rosa con floreritos tradicionales</p>
<img src="images/eventos/foto1.jpg" class="opcion-img">
</div>
</label>


<!-- ESPECIAL -->
<label class="opcion">
<input type="radio" name="decoracion" value="especial">
<div class="opcion-card">
<h3>Especial</h3>
<p>Gasa con floreros de vidrio transparentes con flores y velas</p>
<p class="precio">+$300</p>
<img src="images/eventos/foto2.jpg" class="opcion-img">
</div>
</label>


<!-- UPGRADE -->
<label class="opcion">
<input type="radio" name="decoracion" value="upgrade">
<div class="opcion-card">
<h3>Upgrade</h3>
<p>Mantelitos de hojas y flores + centro de mesa con gasa + flores + velas y copas</p>
<p class="precio">+$500</p>
<img src="images/eventos/foto3.jpg" class="opcion-img">
</div>
</label>


<!-- UPGRADE AMALAY -->
<label class="opcion">
<input type="radio" name="decoracion" value="amalay">
<div class="opcion-card">
<h3>Upgrade Amalay ⭐</h3>
<p>Platos base, centro de mesa con gasa, floreros de vidrio con flores, velas y copas en la noche</p>
<p class="precio">+$650</p>
<img src="images/eventos/foto4.jpg" class="opcion-img">
</div>
</label>

</div>

</body>
</html>
